# Weekly dependency updates. Minor and patch versions arrive together as one
# pull request; a major version gets its own, because it is the one that can
# break. Security updates are a repository setting, not this file.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Majors that are migrations, not bumps; each has its issue.
    ignore:
      - dependency-name: zod # #283
        update-types: ["version-update:semver-major"]
      - dependency-name: prisma # #284
        update-types: ["version-update:semver-major"]
      - dependency-name: '@prisma/client' # #284
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss # #289
        update-types: ["version-update:semver-major"]
      # The types follow the oldest Node we run on (engines >=22): a newer
      # major would let the code call APIs a Node 22 install lacks.
      - dependency-name: '@types/node'
        update-types: ["version-update:semver-major"]
